name: Verify protocol and actual loopback transfers
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/verify_results.py
      - run: python scripts/run_study.py --quick --output-dir build/ci
      - run: python scripts/verify_results.py --output-dir build/ci
      - uses: actions/upload-artifact@v4
        with:
          name: fresh-loopback-study
          path: |
            build/ci/results
            build/ci/docs
